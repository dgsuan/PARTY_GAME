<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal Arcade - Motion-Tracked Games</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cabinet">
    <div class="marquee">
      <span class="marquee-text">SIGNAL ARCADE</span>
      <span class="marquee-sub">motion-tracked games - just you and your camera</span>
    </div>
    <div class="screen">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="game"></canvas>
      <div class="crt-overlay"></div>
      <div id="menuScreen" class="overlay-panel menu-panel">
        <h1>CHOOSE YOUR GAME</h1>
        <div id="menuGrid" class="menu-grid"></div>
        <p class="fine-print">Runs entirely in your browser. Nothing is uploaded - tracking happens on-device.</p>
      </div>
      <div id="errorScreen" class="overlay-panel hidden">
        <h1>NO SIGNAL</h1>
        <p id="errorMsg">Camera access was blocked or unavailable.</p>
        <button id="retryBtn">&#8635; TRY AGAIN</button>
      </div>
      <div id="loadingScreen" class="overlay-panel hidden">
        <div class="spinner"></div>
        <p>Loading tracking model...</p>
      </div>
      <div id="gameOverScreen" class="overlay-panel hidden">
        <h1 id="gameOverTitle">GAME OVER</h1>
        <div id="gameOverLines" class="gameover-lines"></div>
        <div class="gameover-btns">
          <button id="replayBtn">&#8635; PLAY AGAIN</button>
          <button id="menuBtn">&#9776; MAIN MENU</button>
        </div>
      </div>
      <button id="quitBtn" class="quit-btn hidden">&#9776; MENU</button>
    </div>
    <div class="control-strip"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
